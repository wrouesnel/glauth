#################
# An OIDC provider run apart from the LDAP server it checks passwords against.
#
# This process needs no access to the user database: it binds to LDAP as each user
# who signs in. Serve it behind a reverse proxy at https://auth.example.com.
#
# To serve OIDC from the LDAP server's own process instead, add the [oidc] section
# to that server's config and leave out "ldap" and "baseDN".

[ldaps]
  enabled = false

[oidc]
  enabled = true
  domain = "example.com"
  listen = "0.0.0.0:8080"
  stateDir = "/var/lib/glauth"
  ldap = "ldap://ldap.example.com:3893"
  baseDN = "dc=example,dc=com"
  # nameAttribute = "cn"           # the backend's first name format attribute
  # For an LDAP server whose users bind by another name, as Active Directory's
  # by UPN (directly, or through a glauth whose backend is the ldap proxy):
  # bindFormat = "{username}@example.com"           # default: cn={username},{baseDN}
  # userFilter = "(&(objectClass=user)(sAMAccountName={username}))"
  [oidc.branding]
    name = "Example"
