#################
# Default configuration for the container image: serves the Unix accounts in
# /etc/passwd, /etc/shadow and /etc/group. Mount your own at /config/config.cfg.
debug = false

[ldap]
  enabled = true
  listen = "0.0.0.0:389"

[ldaps]
  enabled = false
  listen = "0.0.0.0:636"
  cert = "/config/glauth.crt"
  key = "/config/glauth.key"

[backend]
  datastore = "unix"
  baseDN = "dc=glauth,dc=com"
  nameformat = "cn"
  groupformat = "ou"

  # Members of this group can search the whole directory.
  groupWithSearchCapability = "sudo"

  # Where passwd, shadow and group are read from. Tools such as useradd replace
  # these files by rename, which a bind mount of a single file doesn't see, so
  # mount the host's /etc directory read-only (e.g. at /host/etc) and point
  # this at it to pick up account changes without a restart.
  # unixFilesDir = "/host/etc"

  # Hide system accounts: only serve uids from 1000, plus members of the search
  # group and of these groups.
  # minUIDNumber = 1000
  # exposeGroups = ["ldap-users"]

[api]
  enabled = true
  tls = false
  listen = "0.0.0.0:5555"
