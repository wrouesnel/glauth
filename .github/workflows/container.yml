---
name: Container Build
on:
  workflow_run:
    workflows:
      - Build and Test
    types:
      - completed
    branches:
      - master
  push:
    tags:
      - wrouesnel-v*

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  container-build:
    # workflow_run fires on any completion - only build images from passing builds.
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Build the commit that was tested, not the branch head. Full history
          # and tags let `git describe` stamp the version.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # set latest tag for default branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=schedule
            # Release tags are wrouesnel-v<semver>: tag images 2.6.0, 2.6 and 2.
            type=match,pattern=^wrouesnel-v(\d+\.\d+\.\d+.*)$,group=1
            type=match,pattern=^wrouesnel-v(\d+\.\d+)\.\d+$,group=1
            type=match,pattern=^wrouesnel-v(\d+)\.\d+\.\d+$,group=1
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
